.toolbar{display:flex;align-items:center;gap:7px;padding:0 max(13px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom));flex-shrink:0}.tool{height:48px;min-width:47px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:20px;font-weight:560}.tool.active{background:var(--soft)}.tool.text-tool{font-size:13px;padding:0 13px;font-weight:690}.tool.next{margin-left:auto;padding:0 17px;font-size:14px;font-weight:720}.tool.stop{background:var(--accent);color:var(--accentInk);padding:0 20px;font-size:15px;font-weight:820}.tool.confirm-clear{background:#fff1f2;color:#b91c1c;border-color:#ff96a3;font-size:12px;padding:0 9px}

.table-scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:630px}td,th{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:11px;text-align:left;vertical-align:middle;font-size:13px}th{font-weight:720;background:var(--soft);white-space:nowrap}td:first-child,th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}td:last-child,th:last-child{border-right:0}.cell-button{width:100%;padding:5px;text-align:left;min-width:100px;border:0;border-radius:8px;background:transparent;color:var(--ink)}.cell-button:hover{background:var(--soft)}.score-note{display:block;font-weight:740;color:var(--muted);margin-top:6px;font-size:11px}.mini-ink{width:115px;height:43px;display:block;background:#fff;border-radius:5px;border:1px solid #ededed}

<body>
<div id="app">
<header class="top"><h1 class="brand">STOP</h1><div class="top-space"></div><button class="icon-btn" data-action="theme" aria-label="Cambiar tema" title="Cambiar tema">◐</button><button class="icon-btn" data-action="fullscreen" aria-label="Pantalla completa" title="Pantalla completa">⛶</button></header>
<section id="setup" class="screen"><div class="container">
<div class="intro"><div><h2>Categorías</h2><p id="selectedCount"></p></div></div>
<div id="groups"></div>
<div class="panel"><h3 class="section-title">Para esta partida</h3><div id="picked"></div><div class="add-row"><input id="newCategory" class="add-input" placeholder="Nueva subcategoría" aria-label="Nueva subcategoría"><button class="secondary" data-action="add-category">Agregar</button></div></div>
<div class="continue-row"><button class="primary" data-action="continue">Continuar →</button></div>
</div></section>
<section id="letter" class="screen hidden"><div class="letter-card"><h2>¿Con qué letra?</h2><input id="letterInput" class="letter-field" maxlength="1" autocomplete="off" autocapitalize="characters" aria-label="Letra de esta ronda"><div class="controls"><button class="secondary" data-action="setup">Anterior</button><button class="primary" data-action="start">Comenzar →</button></div></div></section>
<section id="play" class="screen hidden">
<div class="play-head"><button class="icon-btn" data-action="drawer" aria-label="Categorías" title="Categorías">☰</button><button class="icon-btn" data-action="leave" aria-label="Volver" title="Volver">‹</button><div class="play-titles"><strong id="currentName"></strong><span id="currentProgress"></span></div><div id="playLetter" class="letter-chip"></div><button class="icon-btn" data-action="more" aria-label="Más opciones" title="Más opciones">⋯</button></div>
<div class="write-area"><canvas id="ink" aria-label="Escritura con el dedo"></canvas><textarea id="typing" class="hidden" spellcheck="false" autocomplete="off" aria-label="Escribir respuesta con teclado"></textarea></div>
<div class="toolbar"><button class="tool text-tool" data-action="prev">Anterior</button><button class="tool" data-action="undo" aria-label="Deshacer" title="Deshacer">↶</button><button class="tool" id="clearButton" data-action="clear" aria-label="Borrar todo" title="Borrar todo">⌫</button><button class="tool" data-action="keyboard" aria-label="Alternar teclado" title="Alternar teclado">⌨</button><button class="tool next" data-action="next">Siguiente →</button><button class="tool stop" data-action="stop">STOP</button></div>
<div id="shade" class="shade hidden" data-action="close-drawer"></div><aside id="drawer" class="drawer hidden"><div class="drawer-title">Categorías <button class="icon-btn" data-action="close-drawer" aria-label="Cerrar">×</button></div><div id="drawerList"></div></aside>
<div id="popmenu" class="popmenu hidden"><button data-action="allow-blanks">Terminar con casillas vacías</button><button data-action="review-existing">Ver puntuaciones</button></div>
</section>
<section id="review" class="screen hidden"><div class="review-top"><h2>Revisión</h2><button class="pill" id="tableTab" data-action="table">General</button><button class="pill" id="singleTab" data-action="single">Individual</button></div><div id="reviewBody" class="review-content"></div><div class="review-bottom"><button class="secondary" data-action="edit-round">Volver</button><button class="pill" data-action="review-prev" aria-label="Anterior">←</button><span class="small" id="reviewPosition"></span><button class="pill" data-action="review-next" aria-label="Siguiente">→</button><button class="primary" data-action="new-round">Nueva ronda</button></div></section>
</div>
<script>
(function(){
'use strict';
var NORMAL=['Nombre','Apellido','Cosa','Color','Fruta','Ciudad o país','Animal','Comida','Profesión','Deporte','Marca','Película','Planta','Cantante'];
var ALIZABETH=['Nombre de mujer','Nombre de hombre','Apellido','Cosa','Color','Animal','Fruta / Vegetal','Raza de perro','Profesiones','Electrodomésticos','Marcas','Artistas','Películas / Series','Enfermedades'];
var KEY='stop-web-v1';
var initial={theme:'light',activeGroup:'Normal',groups:{Normal:NORMAL,Alizabeth:ALIZABETH},groupSelection:{Normal:NORMAL.slice(0,7),Alizabeth:ALIZABETH.slice(0,4)},selected:NORMAL.slice(0,7),view:'setup',game:null,rounds:[],reviewMode:'table',reviewCell:0,allowBlanks:false};
var data;
try{data=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){data={};}
var state=Object.assign({},initial,data);
state.groups=Object.assign({},initial.groups,data.groups||{});
state.groupSelection=Object.assign({},initial.groupSelection,data.groupSelection||{});
if(!Array.isArray(state.selected))state.selected=initial.selected.slice();
if(!Array.isArray(state.rounds))state.rounds=[];
if(state.game&&!Array.isArray(state.game.answers))state.game=null;
if((state.view==='play'&&!state.game)||(state.view==='review'&&!state.rounds.length))state.view='setup';
var currentStroke=null,clearPending=false,clearTimer=null,reviewTouch=null;
function id(x){return document.getElementById(x);}
function escapeHTML(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function show(view){state.view=view;['setup','letter','play','review'].forEach(function(v){id(v).classList.toggle('hidden',view!==v);});save();if(view==='setup')renderSetup();if(view==='letter'){id('letterInput').value='';setTimeout(function(){id('letterInput').focus();},50);}if(view==='play')renderGame();if(view==='review')renderReview();}
function applyTheme(){document.documentElement.dataset.theme=state.theme;document.querySelector('meta[name="theme-color"]').content=state.theme==='dark'?'#121417':'#f7f8fb';}
function renderSetup(){
 id('selectedCount').textContent=state.selected.length+' seleccionadas';
 var groups='';
 ['Normal','Alizabeth'].forEach(function(name){
  var options=state.groups[name]||[],chosen=state.groupSelection[name]||[];
  groups+='<details class="group"><summary><span class="group-title">'+escapeHTML(name)+'</span><span class="small">'+options.length+' subcategorías · '+chosen.length+'/'+options.length+'</span></summary><div class="group-body"><div class="group-actions"><span class="small">Selecciona las categorías</span><button class="pill" data-action="use-group" data-group="'+name+'">Usar este grupo</button></div><div class="select-grid">';
  options.forEach(function(n,j){groups+='<label class="option"><input type="checkbox" data-group="'+name+'" data-group-index="'+j+'" '+(chosen.indexOf(n)!==-1?'checked':'')+'><span>'+escapeHTML(n)+'</span></label>';});
  groups+='</div></div></details>';
 });
 id('groups').innerHTML=groups;
 id('picked').innerHTML=state.selected.map(function(n,j){return '<div class="picked"><span class="number">'+(j+1)+'</span><input data-selected-index="'+j+'" aria-label="Nombre de categoría '+(j+1)+'" value="'+escapeHTML(n)+'"><button class="mini" data-action="move-up" data-index="'+j+'" title="Subir" aria-label="Subir">↑</button><button class="mini" data-action="move-down" data-index="'+j+'" title="Bajar" aria-label="Bajar">↓</button><button class="mini danger" data-action="remove" data-index="'+j+'" title="Quitar" aria-label="Quitar '+escapeHTML(n)+'">×</button></div>';}).join('')||'<div class="empty">Sin categorías</div>';
}
function currentAnswer(){return state.game.answers[state.game.index];}
function filled(a){return !!(a&&(String(a.text||'').trim()||(a.strokes&&a.strokes.some(function(s){return s.length;}))));}
function doneCount(){return state.game.answers.filter(filled).length;}
function renderGame(){
 if(!state.game)return;
 var g=state.game,a=currentAnswer();
 id('currentName').textContent=g.categories[g.index];id('currentProgress').textContent=(g.index+1)+' / '+g.categories.length+' · '+doneCount()+'/'+g.categories.length;id('playLetter').textContent=g.letter;
 id('typing').value=a.text||'';id('typing').classList.toggle('hidden',a.mode!=='text');id('ink').classList.toggle('hidden',a.mode==='text');
 document.querySelector('[data-action="next"]').classList.toggle('hidden',g.index===g.categories.length-1);
 var stop=document.querySelector('[data-action="stop"]');stop.disabled=!(doneCount()===g.categories.length||state.allowBlanks);
 document.querySelector('[data-action="keyboard"]').classList.toggle('active',a.mode==='text');
 id('drawerList').innerHTML=g.categories.map(function(n,i){return '<button class="drawer-item '+(i===g.index?'active':'')+'" data-action="go-category" data-index="'+i+'"><span>'+escapeHTML(n)+'</span><span class="check">'+(filled(g.answers[i])?'✓':'○')+'</span></button>';}).join('');
 id('popmenu').classList.add('hidden');closeDrawer();resetClear();requestAnimationFrame(resizeCanvas);
}
function closeDrawer(){id('drawer').classList.add('hidden');id('shade').classList.add('hidden');}
function point(e,can){var r=can.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width))),Math.max(0,Math.min(1,(e.clientY-r.top)/Math.max(1,r.height)))];}
function drawStrokes(canvas,strokes){
 if(!canvas)return;
 var r=canvas.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),dpr=Math.min(devicePixelRatio||1,3);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.strokeStyle='#182230';ctx.fillStyle='#182230';ctx.lineWidth=Math.max(2.4,Math.min(5,w*.007));ctx.lineCap='round';ctx.lineJoin='round';
 (strokes||[]).forEach(function(st){
  if(!st||!st.length)return;
  if(st.length===1){ctx.beginPath();ctx.arc(st[0][0]*w,st[0][1]*h,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();return;}
  ctx.beginPath();ctx.moveTo(st[0][0]*w,st[0][1]*h);
  for(var i=1;i<st.length-1;i++){var midx=(st[i][0]+st[i+1][0])/2,midy=(st[i][1]+st[i+1][1])/2;ctx.quadraticCurveTo(st[i][0]*w,st[i][1]*h,midx*w,midy*h);}
  ctx.lineTo(st[st.length-1][0]*w,st[st.length-1][1]*h);ctx.stroke();
 });
}
function resizeCanvas(){if(state.view==='play'&&state.game&&currentAnswer().mode!=='text')drawStrokes(id('ink'),currentAnswer().strokes||[]);}
function resetClear(){clearPending=false;clearTimeout(clearTimer);var b=id('clearButton');b.classList.remove('confirm-clear');b.textContent='⌫';b.title='Borrar todo';}
function changeIndex(i){if(!state.game)return;state.game.index=Math.min(state.game.categories.length-1,Math.max(0,i));save();renderGame();}
function stopGame(){
 var g=state.game;if(!g)return;
 if(doneCount()!==g.categories.length&&!state.allowBlanks)return;
 var r={letter:g.letter,categories:g.categories.slice(),answers:JSON.parse(JSON.stringify(g.answers)),scores:Array.isArray(g.scores)?g.scores.slice():g.categories.map(function(){return 0;})};
 if(Number.isInteger(g.editRound)&&g.editRound>=0&&g.editRound<state.rounds.length)state.rounds[g.editRound]=r;
 else state.rounds.push(r);
 state.game.editRound=state.rounds.length-1;state.reviewCell=Math.max(0,reviewCells().length-g.categories.length);
 state.reviewMode='table';show('review');
}
function reviewCells(){var out=[];state.rounds.forEach(function(r,i){r.categories.forEach(function(c,j){out.push({r:i,a:j});});});return out;}
function total(r){return (r.scores||[]).reduce(function(x,y){return x+(Number(y)||0);},0);}
function responseHTML(a,r,j,short){
 var x=a||{};if(x.text&&String(x.text).trim())return '<span class="'+(short?'':'answer-text')+'">'+escapeHTML(x.text)+'</span>';
 if(x.strokes&&x.strokes.length)return '<canvas class="'+(short?'mini-ink':'preview-ink')+'" data-r="'+r+'" data-a="'+j+'" aria-label="Respuesta manuscrita"></canvas>';
 return '<span class="muted">—</span>';
}
function paintPreviews(){requestAnimationFrame(function(){document.querySelectorAll('.mini-ink,.preview-ink').forEach(function(c){var r=Number(c.dataset.r),a=Number(c.dataset.a),item=state.rounds[r];if(item&&item.answers[a])drawStrokes(c,item.answers[a].strokes);});});}
function renderReview(){
 id('tableTab').classList.toggle('active',state.reviewMode==='table');id('singleTab').classList.toggle('active',state.reviewMode==='single');
 var body=id('reviewBody'),cells=reviewCells();if(!cells.length){body.innerHTML='<div class="empty">Sin respuestas</div>';return;}
 if(state.reviewMode==='table'){
  var all=[];state.rounds.forEach(function(r){r.categories.forEach(function(n){if(all.indexOf(n)<0)all.push(n);});});
  var s='<div class="table-scroll"><table><thead><tr><th>Ronda</th>'+all.map(function(n){return '<th>'+escapeHTML(n)+'</th>';}).join('')+'<th>Total</th></tr></thead><tbody>';
  state.rounds.forEach(function(r,i){
   s+='<tr><td><strong>'+escapeHTML(r.letter)+'</strong><div class="small">'+(i+1)+'</div></td>';
   all.forEach(function(n){var j=r.categories.indexOf(n);s+='<td>'+(j<0?'—':'<button class="cell-button" data-action="cell" data-r="'+i+'" data-a="'+j+'">'+responseHTML(r.answers[j],i,j,true)+'<span class="score-note">'+(Number(r.scores[j])||0)+' pt</span></button>')+'</td>';});
   s+='<td><strong>'+total(r)+'</strong></td></tr>';
  });
  s+='</tbody></table></div><div class="stat"><span>Total general</span><strong>'+state.rounds.reduce(function(x,r){return x+total(r);},0)+'</strong></div>';
  body.innerHTML=s;id('reviewPosition').textContent=state.rounds.length+' ronda(s)';
 }else{
  state.reviewCell=Math.max(0,Math.min(cells.length-1,state.reviewCell));var pos=cells[state.reviewCell],r=state.rounds[pos.r],a=r.answers[pos.a],sc=Number(r.scores[pos.a])||0;
  body.innerHTML='<div class="single"><div class="single-head"><div><div class="small">Ronda '+(pos.r+1)+' · Letra '+escapeHTML(r.letter)+'</div><h3>'+escapeHTML(r.categories[pos.a])+'</h3></div><span class="small">'+(state.reviewCell+1)+' / '+cells.length+'</span></div><div class="answer">'+responseHTML(a,pos.r,pos.a,false)+'</div><div class="scores">'+[0,5,10].map(function(v){return '<button class="pill '+(sc===v?'active':'')+'" data-action="score" data-score="'+v+'">'+v+'</button>';}).join('')+'<input class="score-custom" type="number" min="0" max="9999" step="1" id="scoreInput" aria-label="Puntuación" value="'+sc+'"></div><div class="stat"><span>Total de la ronda</span><strong>'+total(r)+'</strong></div></div>';
  id('reviewPosition').textContent=(state.reviewCell+1)+' / '+cells.length;
 }
 paintPreviews();
}
function setScore(v){var cell=reviewCells()[state.reviewCell];if(!cell)return;state.rounds[cell.r].scores[cell.a]=Math.max(0,Math.min(9999,Number(v)||0));save();renderReview();}
function startRound(letter){
 var cats=state.selected.map(function(s){return s.trim();}).filter(Boolean);
 if(!cats.length)return;
 state.game={letter:letter,categories:cats,answers:cats.map(function(){return {strokes:[],text:'',mode:'ink'};}),index:0,editRound:-1,scores:cats.map(function(){return 0;})};state.allowBlanks=false;show('play');
}
document.addEventListener('change',function(e){
 var x=e.target;
 if(x.matches('[data-group-index]')){
  var group=x.dataset.group,list=state.groupSelection[group]||[],name=state.groups[group][Number(x.dataset.groupIndex)];
  if(x.checked&&list.indexOf(name)<0)list.push(name);if(!x.checked)list=list.filter(function(v){return v!==name;});
  state.groupSelection[group]=list;state.activeGroup=group;state.selected=state.groups[group].filter(function(v){return list.indexOf(v)!==-1;});save();renderSetup();
 }
 if(x.matches('[data-selected-index]')){var k=Number(x.dataset.selectedIndex),v=x.value.trim();if(v)state.selected[k]=v;save();renderSetup();}
 if(x.id==='scoreInput')setScore(x.value);
});
id('typing').addEventListener('input',function(){if(!state.game)return;currentAnswer().text=this.value;save();id('currentProgress').textContent=(state.game.index+1)+' / '+state.game.categories.length+' · '+doneCount()+'/'+state.game.categories.length;document.querySelector('[data-action="stop"]').disabled=!(doneCount()===state.game.categories.length||state.allowBlanks);});
id('letterInput').addEventListener('input',function(){this.value=this.value.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]/g,'').slice(0,1).toUpperCase();});
id('letterInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.querySelector('[data-action="start"]').click();});
id('newCategory').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-action="add-category"]').click();}});
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-action]');if(!b)return;var a=b.dataset.action;
 if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';applyTheme();save();return;}
 if(a==='fullscreen'){if(document.fullscreenElement){document.exitFullscreen().catch(function(){});}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(function(){});}return;}
 if(a==='use-group'){var n=b.dataset.group;state.activeGroup=n;state.groupSelection[n]=state.groups[n].slice();state.selected=state.groups[n].slice();save();renderSetup();return;}
 if(a==='remove'){state.selected.splice(Number(b.dataset.index),1);save();renderSetup();return;}
 if(a==='move-up'||a==='move-down'){var k=Number(b.dataset.index),next=k+(a==='move-up'?-1:1);if(next>=0&&next<state.selected.length){var tmp=state.selected[k];state.selected[k]=state.selected[next];state.selected[next]=tmp;save();renderSetup();}return;}
 if(a==='add-category'){var inp=id('newCategory'),v=inp.value.trim();if(v&&!state.selected.some(function(n){return n.toLowerCase()===v.toLowerCase();})){state.selected.push(v);save();renderSetup();}else if(v){inp.value='';}return;}
 if(a==='continue'){if(!state.selected.some(function(s){return s.trim();})){alert('Selecciona una categoría.');return;}show('letter');return;}
 if(a==='setup'){show('setup');return;}
 if(a==='start'){var letter=id('letterInput').value.trim().toUpperCase();if(!letter){id('letterInput').focus();return;}startRound(letter);return;}
 if(a==='drawer'){id('drawer').classList.remove('hidden');id('shade').classList.remove('hidden');return;}
 if(a==='close-drawer'){closeDrawer();return;}
 if(a==='go-category'){changeIndex(Number(b.dataset.index));return;}
 if(a==='more'){id('popmenu').classList.toggle('hidden');return;}
 if(a==='allow-blanks'){id('popmenu').classList.add('hidden');if(confirm('¿Todos están de acuerdo en terminar con casillas vacías?')){state.allowBlanks=true;save();renderGame();}return;}
 if(a==='review-existing'){id('popmenu').classList.add('hidden');if(state.rounds.length){state.reviewMode='table';show('review');}return;}
 if(a==='leave'){if(confirm('¿Salir de la escritura? Tus respuestas se conservarán.'))show('setup');return;}
 if(a==='prev'){changeIndex(state.game.index-1);return;}
 if(a==='next'){changeIndex(state.game.index+1);return;}
 if(a==='undo'){var item=currentAnswer();if(item.mode==='text'){item.text=item.text.slice(0,-1);id('typing').value=item.text;}else item.strokes.pop();save();renderGame();return;}
 if(a==='clear'){
  if(!clearPending){clearPending=true;b.classList.add('confirm-clear');b.textContent='Confirmar';clearTimer=setTimeout(resetClear,2600);return;}
  var item=currentAnswer();item.text='';item.strokes=[];resetClear();save();renderGame();return;
 }
 if(a==='keyboard'){var item=currentAnswer();item.mode=item.mode==='text'?'ink':'text';save();renderGame();if(item.mode==='text')id('typing').focus();return;}
 if(a==='stop'){stopGame();return;}
 if(a==='table'){state.reviewMode='table';save();renderReview();return;}
 if(a==='single'){state.reviewMode='single';save();renderReview();return;}
 if(a==='cell'){var cells=reviewCells();state.reviewCell=cells.findIndex(function(c){return c.r===Number(b.dataset.r)&&c.a===Number(b.dataset.a);});state.reviewMode='single';save();renderReview();return;}
 if(a==='review-prev'||a==='review-next'){state.reviewMode='single';state.reviewCell=Math.max(0,Math.min(reviewCells().length-1,state.reviewCell+(a==='review-prev'?-1:1)));save();renderReview();return;}
 if(a==='score'){setScore(b.dataset.score);return;}
 if(a==='edit-round'){if(state.rounds.length){var r=state.rounds[state.rounds.length-1];state.game={letter:r.letter,categories:r.categories.slice(),answers:JSON.parse(JSON.stringify(r.answers)),scores:r.scores.slice(),index:0,editRound:state.rounds.length-1};state.allowBlanks=true;show('play');}else show('setup');return;}
 if(a==='new-round'){show('letter');return;}
});
var canvas=id('ink');
canvas.addEventListener('pointerdown',function(e){if(!state.game||currentAnswer().mode==='text')return;e.preventDefault();this.setPointerCapture(e.pointerId);currentStroke=[point(e,this)];currentAnswer().strokes.push(currentStroke);resizeCanvas();});
canvas.addEventListener('pointermove',function(e){if(!currentStroke||!this.hasPointerCapture(e.pointerId))return;e.preventDefault();currentStroke.push(point(e,this));resizeCanvas();});
function finishStroke(){if(currentStroke){currentStroke=null;save();renderGame();}}
canvas.addEventListener('pointerup',finishStroke);canvas.addEventListener('pointercancel',finishStroke);
id('reviewBody').addEventListener('touchstart',function(e){if(e.touches.length===1)reviewTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
id('reviewBody').addEventListener('touchend',function(e){if(!reviewTouch||state.reviewMode!=='single'||!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-reviewTouch.x,dy=e.changedTouches[0].clientY-reviewTouch.y;reviewTouch=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){state.reviewCell=Math.max(0,Math.min(reviewCells().length-1,state.reviewCell+(dx<0?1:-1)));save();renderReview();}},{passive:true});
window.addEventListener('resize',function(){resizeCanvas();if(state.view==='review')paintPreviews();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDrawer();id('popmenu').classList.add('hidden');}if(state.view==='review'&&state.reviewMode==='single'&&e.target.tagName!=='INPUT'){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){state.reviewCell=Math.max(0,Math.min(reviewCells().length-1,state.reviewCell+(e.key==='ArrowRight'?1:-1)));save();renderReview();}}});
applyTheme();show(state.view);
})();
</script>
</body>
</html>
